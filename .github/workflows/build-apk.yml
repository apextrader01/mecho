name: Build ShortEdge Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install NPM Dependencies (Capacitor)
        run: |
          npm install --ignore-scripts
          cd client && npm install --ignore-scripts && cd ..

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Grant Execute Permission for Gradlew
        run: chmod +x client/android/gradlew

      - name: Build Android Debug APK
        run: |
          cd client/android
          ./gradlew assembleDebug --no-daemon --stacktrace > build.log 2>&1 || (
            echo "================ GRADLE BUILD FAILED ================"
            cat build.log
            exit 1
          )

      - name: Check Output APK
        run: |
          ls -la client/android/app/build/outputs/apk/debug/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShortEdge-Debug-APK
          path: client/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Save Build Log on Failure
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B build-logs
          git add client/android/build.log || true
          git commit -m "chore: save build log" || true
          git push -f origin build-logs || true
