name: Build ShortEdge Android APKs (Customer, Partner, Admin)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apks:
    name: Build All 3 Android APKs
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install NPM Dependencies (Capacitor)
        run: |
          npm install --ignore-scripts
          cd client && npm install --ignore-scripts && cd ..

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" || true

      - name: Grant Execute Permission for Gradlew
        run: chmod +x client/android/gradlew

      - name: Build All 3 Android Debug APKs
        run: |
          cd client/android
          ./gradlew assembleDebug --no-daemon --stacktrace > ../../build_error.txt 2>&1 || (
            echo "================ GRADLE BUILD FAILED ================"
            cat ../../build_error.txt
            exit 1
          )

      - name: Inspect Built APKs
        run: |
          find client/android/app/build/outputs/apk/ -name "*.apk"

      - name: Upload Customer Super-App APK
        uses: actions/upload-artifact@v4
        with:
          name: ShortEdge-Customer-APK
          path: client/android/app/build/outputs/apk/customer/debug/*.apk
          if-no-files-found: error

      - name: Upload Partner / Vendor APK
        uses: actions/upload-artifact@v4
        with:
          name: ShortEdge-Partner-APK
          path: client/android/app/build/outputs/apk/partner/debug/*.apk
          if-no-files-found: error

      - name: Upload Admin Central Command APK
        uses: actions/upload-artifact@v4
        with:
          name: ShortEdge-Admin-APK
          path: client/android/app/build/outputs/apk/admin/debug/*.apk
          if-no-files-found: error

      - name: Upload All 3 APKs Bundle
        uses: actions/upload-artifact@v4
        with:
          name: ShortEdge-All-3-APKs-Bundle
          path: client/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Save Build Log on Failure
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B build-logs
          git add -f build_error.txt || true
          git commit -m "chore: save build log" || true
          git push -f origin build-logs || true
